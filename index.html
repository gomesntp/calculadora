<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="icone.ico">
  <title>Calculadora — Marketada</title>
  <style>
    :root {
      --bg: #0a1628;
      --bg-secondary: #0d1c30;
      --card: #12233a;
      --card-hover: #162b45;
      --border: #1e3a55;
      --border-light: #2a4d6e;
      --gold: #e8b923;
      --gold-light: #f0c94a;
      --gold-dark: #c99a1a;
      --blue-btn: #7eb8d4;
      --text: #f5f0e8;
      --text-muted: #9ab0c4;
      --text-dim: #6a849c;
      --cream: #f5f0e6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(ellipse 70% 40% at 50% -5%, rgba(232, 185, 35, 0.08) 0%, transparent 55%),
        radial-gradient(ellipse 50% 30% at 85% 90%, rgba(126, 184, 212, 0.06) 0%, transparent 50%);
    }

    /* ========== HEADER ========== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 48px;
      background: rgba(10, 22, 40, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-area img {
      height: 62px;
      width: auto;
      filter: drop-shadow(0 2px 10px rgba(232, 185, 35, 0.2));
      transition: transform 0.25s ease;
    }

    .logo-area img:hover {
      transform: scale(1.04);
    }

    .logo-text h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .logo-text h1 span {
      color: var(--gold);
    }

    .logo-text p {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 2px;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 8px 8px 8px 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-area:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(232, 185, 35, 0.15);
    }

    .input-area label {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
    }

    .input-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #quantidade {
      width: 120px;
      background: transparent;
      border: none;
      padding: 8px 4px;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-light);
      text-align: center;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    #quantidade::-webkit-inner-spin-button,
    #quantidade::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    button.btn {
      background: var(--gold);
      color: #0a1628;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(232, 185, 35, 0.3);
    }

    button.btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(232, 185, 35, 0.4);
    }

    button.btn:active {
      transform: scale(0.94);
    }

    .error {
      color: #e07a5f;
      font-size: 0.78rem;
      min-height: 1.1em;
      text-align: right;
      margin-top: 6px;
      padding-right: 8px;
    }

    /* ========== MAIN ========== */
    main {
      flex: 1;
      padding: 36px 48px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .grid-wide {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-light);
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card .label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 500;
    }

    .card .value {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .card .sub {
      font-size: 0.74rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .card.gold {
      border-color: rgba(232, 185, 35, 0.3);
      background: linear-gradient(160deg, #1a2a18 0%, #12233a 100%);
    }

    .card.gold .value {
      color: var(--gold-light);
    }

    .card.highlight {
      border-color: rgba(232, 185, 35, 0.5);
      background: linear-gradient(145deg, #1f2e15 0%, #152a12 40%, #12233a 100%);
      box-shadow: 0 0 30px rgba(232, 185, 35, 0.1);
    }

    .card.highlight .value {
      color: var(--gold-light);
      text-shadow: 0 0 20px rgba(232, 185, 35, 0.3);
    }

    .card.highlight .label {
      color: var(--gold);
    }

    /* ========== FOOTER ========== */
    footer {
      text-align: center;
      padding: 18px 24px;
      color: var(--text-dim);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    footer span {
      color: var(--gold);
      font-weight: 600;
    }

    /* Responsivo */
    @media (max-width: 1400px) {
      .grid-wide { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 1100px) {
      header {
        flex-direction: column;
        gap: 16px;
        padding: 16px 24px;
      }
      main { padding: 28px 20px; }
      .grid, .grid-wide { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .grid, .grid-wide { grid-template-columns: 1fr; }
      .logo-area img { height: 50px; }
      .logo-text h1 { font-size: 1.2rem; }
      #quantidade { width: 100px; font-size: 1.15rem; }
      .input-area { border-radius: 16px; padding: 10px 12px; flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-area">
      <img src="https://r2.fivemanage.com/rKtnN53BqfGso2028mTk2/complexo.png" alt="Marketada Logo">
      <div class="logo-text">
        <h1>Calculadora de <span>Produção</span></h1>
        <p>Materiais • Peso • Mochilas • Valor final</p>
      </div>
    </div>

    <div>
      <div class="input-area">
        <label for="quantidade">Quantidade desejada</label>
        <div class="input-controls">
          <button class="btn" id="btn-menos" aria-label="Diminuir">−</button>
          <input type="number" id="quantidade" value="2000" min="1" step="1">
          <button class="btn" id="btn-mais" aria-label="Aumentar">+</button>
        </div>
      </div>
      <div class="error" id="erro"></div>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <!-- Materiais -->
    <div>
      <div class="section-title">Materiais necessários</div>
      <div class="grid" id="materiais"></div>
    </div>

    <!-- Produção + Peso + Valor -->
    <div>
      <div class="section-title">Produção, peso e valor</div>
      <div class="grid-wide" id="producao"></div>
    </div>
  </main>

  <footer>
    Cada lote produz <span>33 unidades</span> e consome 
    <span>4 refrigerantes</span> + <span>4 xaropes</span> + 
    <span>4 balas de goma</span> + <span>1 misturador</span>
  </footer>

  <script>
    const inputQtd = document.getElementById('quantidade');
    const erroEl = document.getElementById('erro');
    const materiaisEl = document.getElementById('materiais');
    const producaoEl = document.getElementById('producao');
    const btnMenos = document.getElementById('btn-menos');
    const btnMais = document.getElementById('btn-mais');

    const UNIDADES_POR_LOTE = 33;
    const REFRIGERANTES_POR_LOTE = 4;
    const XAROPES_POR_LOTE = 4;
    const BALAS_POR_LOTE = 4;
    const MISTURADORES_POR_LOTE = 1;
    const PESO_POR_UNIDADE = 0.2;
    const CAPACIDADE_MOCHILA = 100;
    const VALOR_UNITARIO = 80;

    function formatarNumero(n) {
      return n.toLocaleString('pt-BR');
    }

    function formatarMoeda(n) {
      return '$ ' + n.toLocaleString('pt-BR');
    }

    function calcular(qtd) {
      const lotes = Math.ceil(qtd / UNIDADES_POR_LOTE);
      const refrigerantes = lotes * REFRIGERANTES_POR_LOTE;
      const xaropes = lotes * XAROPES_POR_LOTE;
      const balas = lotes * BALAS_POR_LOTE;
      const misturadores = lotes * MISTURADORES_POR_LOTE;
      const producaoReal = lotes * UNIDADES_POR_LOTE;
      const pesoTotal = qtd * PESO_POR_UNIDADE;
      const mochilas = Math.ceil(pesoTotal / CAPACIDADE_MOCHILA);
      const valorTotal = qtd * VALOR_UNITARIO;

      return { lotes, refrigerantes, xaropes, balas, misturadores, producaoReal, pesoTotal, mochilas, valorTotal };
    }

    function renderizar(dados, qtd) {
      materiaisEl.innerHTML = `
        <div class="card">
          <span class="label">Refrigerantes</span>
          <span class="value">${formatarNumero(dados.refrigerantes)}</span>
          <span class="sub">4 por lote × ${dados.lotes} lotes</span>
        </div>
        <div class="card">
          <span class="label">Xaropes</span>
          <span class="value">${formatarNumero(dados.xaropes)}</span>
          <span class="sub">4 por lote × ${dados.lotes} lotes</span>
        </div>
        <div class="card">
          <span class="label">Balas de goma</span>
          <span class="value">${formatarNumero(dados.balas)}</span>
          <span class="sub">4 por lote × ${dados.lotes} lotes</span>
        </div>
        <div class="card gold">
          <span class="label">Misturadores</span>
          <span class="value">${formatarNumero(dados.misturadores)}</span>
          <span class="sub">1 por lote × ${dados.lotes} lotes</span>
        </div>
      `;

      producaoEl.innerHTML = `
        <div class="card gold">
          <span class="label">Produção real</span>
          <span class="value">${formatarNumero(dados.producaoReal)}</span>
          <span class="sub">${dados.lotes} lotes × 33 un</span>
        </div>
        <div class="card">
          <span class="label">Peso total</span>
          <span class="value">${formatarNumero(dados.pesoTotal)} kg</span>
          <span class="sub">${formatarNumero(qtd)} × 0,2 kg</span>
        </div>
        <div class="card">
          <span class="label">Mochilas</span>
          <span class="value">${formatarNumero(dados.mochilas)}</span>
          <span class="sub">100 kg cada</span>
        </div>
        <div class="card">
          <span class="label">Valor unitário</span>
          <span class="value">${formatarMoeda(VALOR_UNITARIO)}</span>
          <span class="sub">Preço fixo</span>
        </div>
        <div class="card highlight">
          <span class="label">Valor total final</span>
          <span class="value">${formatarMoeda(dados.valorTotal)}</span>
          <span class="sub">${formatarNumero(qtd)} × $ 80</span>
        </div>
      `;
    }

    function atualizar() {
      const valor = inputQtd.value.trim();
      const qtd = parseInt(valor, 10);

      if (valor === '' || isNaN(qtd) || qtd < 1 || !Number.isInteger(qtd)) {
        erroEl.textContent = 'Informe um número inteiro positivo.';
        materiaisEl.innerHTML = '';
        producaoEl.innerHTML = '';
        return;
      }

      erroEl.textContent = '';
      const dados = calcular(qtd);
      renderizar(dados, qtd);
    }

    inputQtd.addEventListener('input', atualizar);
    inputQtd.addEventListener('change', atualizar);

    btnMenos.addEventListener('click', () => {
      const atual = parseInt(inputQtd.value, 10) || 0;
      if (atual > 1) {
        inputQtd.value = atual - 1;
        atualizar();
      }
    });

    btnMais.addEventListener('click', () => {
      const atual = parseInt(inputQtd.value, 10) || 0;
      inputQtd.value = atual + 1;
      atualizar();
    });

    // Inicializa
    atualizar();
  </script>
</body>
</html>
